services:
  db:
    image: pgvector/pgvector:pg16
    container_name: thedaaakhouse-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-thedaaakhouse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-thedaaakhouse}
      POSTGRES_DB: ${POSTGRES_DB:-thedaaakhouse}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-thedaaakhouse}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: thedaaakhouse-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    # Reserved for future background-job queue (RQ/Celery).
    # Backend does NOT require redis for milestone 1.

volumes:
  postgres-data:
